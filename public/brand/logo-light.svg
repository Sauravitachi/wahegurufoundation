<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="wfGoldGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED181" />
      <stop offset="50%" stop-color="#D0AC60" />
      <stop offset="100%" stop-color="#B08A45" />
    </linearGradient>
    <filter id="wfGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#EED181" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Emblem Mark (Left) -->
  <g transform="translate(15, 10)">
    <!-- Base Circular Halo with Gold Border -->
    <circle cx="50" cy="50" r="48" fill="#1F416F" stroke="url(#wfGoldGradLight)" stroke-width="2.5" />
    
    <!-- Outer Decorative Seva Rays (Subtle Ring) -->
    <circle cx="50" cy="50" r="42" fill="none" stroke="#EED181" stroke-width="1" stroke-dasharray="3 3" opacity="0.8" />

    <!-- Open Hands (Cradling/Giving Seva Motif) -->
    <path d="M 24 74 C 28 62, 38 56, 48 64 C 44 72, 36 78, 24 74 Z" fill="url(#wfGoldGradLight)" opacity="0.95" />
    <path d="M 76 74 C 72 62, 62 56, 52 64 C 56 72, 64 78, 76 74 Z" fill="url(#wfGoldGradLight)" opacity="0.95" />
    
    <!-- Central Khanda & Flame Motif -->
    <path d="M 50 16 L 53 45 L 50 56 L 47 45 Z" fill="url(#wfGoldGradLight)" />
    <!-- Khanda Central Ring (Chakkar) -->
    <circle cx="50" cy="46" r="14" fill="none" stroke="url(#wfGoldGradLight)" stroke-width="3" />
    <!-- Curved Kirpans (Left & Right Protective Arcs) -->
    <path d="M 33 58 C 30 42, 38 30, 48 24 C 44 32, 40 46, 42 60 C 38 60, 35 60, 33 58 Z" fill="url(#wfGoldGradLight)" />
    <path d="M 67 58 C 70 42, 62 30, 52 24 C 56 32, 60 46, 58 60 C 62 60, 65 60, 67 58 Z" fill="url(#wfGoldGradLight)" />

    <!-- Pure Flame of Wisdom & Compassion atop Sword -->
    <path d="M 50 14 C 47 19, 44 24, 47 28 C 50 25, 52 22, 50 14 Z" fill="#EED181" filter="url(#wfGlowLight)" />

    <!-- Sacred Ik Onkar Symbol Accent at base of Chakkar -->
    <circle cx="50" cy="46" r="6" fill="#162F52" />
    <path d="M 47 45 C 47 43, 50 42, 52 44 C 54 46, 52 49, 49 48 C 51 49, 53 50, 53 52" stroke="url(#wfGoldGradLight)" stroke-width="1.8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Typography: Organization Name & Gurmukhi Tagline (Light on Dark) -->
  <g transform="translate(135, 30)">
    <!-- Primary Brand Title -->
    <text x="0" y="32" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#FFFDF8" letter-spacing="0.5">
      WAHEGURU
    </text>
    <text x="194" y="32" font-family="'Plus Jakarta Sans', Inter, sans-serif" font-size="30" font-weight="300" fill="#EED181" letter-spacing="1">
      FOUNDATION
    </text>

    <!-- Subtitle: Values & Gurmukhi -->
    <text x="2" y="58" font-family="'Noto Sans Gurmukhi', 'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#EED181" opacity="0.9" letter-spacing="1.5">
      ੴ • ਸਰਬੱਤ ਦਾ ਭਲਾ • SELFLESS SERVICE &amp; UPLIFTMENT
    </text>
  </g>
</svg>
